name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: content/ is valid
        run: npm run validate

      # src/content.generated.js and sheets/ are both derived from content/*.md.
      # If either drifts, the repo starts telling two different stories.
      - name: Generated files are in sync with content/
        run: |
          npm run build:data
          npm run build:sheets
          git diff --exit-code src/content.generated.js sheets/ \
            || { echo "::error::Generated files are stale — run 'npm run build:data && npm run build:sheets' and commit"; exit 1; }
